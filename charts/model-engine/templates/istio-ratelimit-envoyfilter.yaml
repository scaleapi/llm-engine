{{- if (.Values.rateLimits).enabled -}}
{{- $fullName := include "modelEngine.fullname" . -}}
{{- $routes := .Values.rateLimits.routes -}}
{{- $tenants := .Values.rateLimits.throttledTenants | default list -}}
# Envoy local_ratelimit on the gateway sidecars (inbound), giving per-pod token
# buckets. Buckets are per Envoy process, so the fleet-wide ceiling is
# (limit x Ready pods) and scales with the HPA. Overflow is rejected at the proxy
# as 429 and never consumes a gateway worker.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ $fullName }}-ratelimit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modelEngine.labels" . | nindent 4 }}
spec:
  workloadSelector:
    labels:
      app: {{ $fullName }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: model_engine_ratelimit
            status:
              code: TooManyRequests
            # Default bucket for traffic matching no descriptor: effectively unlimited.
            token_bucket:
              max_tokens: 100000
              tokens_per_fill: 100000
              fill_interval: 1s
            always_consume_default_token_bucket: false
            filter_enabled:
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header:
                  key: x-local-rate-limited
                  value: "true"
            descriptors:
              - entries:
                  - key: route
                    value: get_async_task
                token_bucket:
                  max_tokens: {{ $routes.getAsyncTask.burst }}
                  tokens_per_fill: {{ $routes.getAsyncTask.requestsPerSecondPerPod }}
                  fill_interval: 1s
              - entries:
                  - key: route
                    value: post_async_tasks
                token_bucket:
                  max_tokens: {{ $routes.postAsyncTasks.burst }}
                  tokens_per_fill: {{ $routes.postAsyncTasks.requestsPerSecondPerPod }}
                  fill_interval: 1s
              {{- range $tenants }}
              - entries:
                  - key: tenant
                    value: {{ printf "clamp_%s" .userId | quote }}
                token_bucket:
                  max_tokens: {{ .requestsPerSecondPerPod }}
                  tokens_per_fill: {{ .requestsPerSecondPerPod }}
                  fill_interval: 1s
              {{- end }}
    - applyTo: VIRTUAL_HOST
      match:
        context: SIDECAR_INBOUND
        routeConfiguration:
          vhost:
            name: "inbound|http|80"
      patch:
        operation: MERGE
        value:
          rate_limits:
            # :path includes the query string, so async-task submission (which carries
            # ?model_endpoint_id=...) must be matched by prefix, and the trailing slash
            # on the poll prefix keeps POST /v1/async-tasks out of the GET bucket.
            - actions:
                - header_value_match:
                    descriptor_key: route
                    descriptor_value: get_async_task
                    headers:
                      - name: ":method"
                        string_match:
                          exact: GET
                      - name: ":path"
                        string_match:
                          prefix: /v1/async-tasks/
            - actions:
                - header_value_match:
                    descriptor_key: route
                    descriptor_value: post_async_tasks
                    headers:
                      - name: ":method"
                        string_match:
                          exact: POST
                      - name: ":path"
                        string_match:
                          prefix: /v1/async-tasks
            {{- range $tenants }}
            {{- /* Callers authenticate with HTTP Basic (base64 of "userId:password")
                 or Bearer (raw userId). A 24-char user id encodes to exactly 32
                 base64 chars, so that prefix matches any password. */}}
            - actions:
                - header_value_match:
                    descriptor_key: tenant
                    descriptor_value: {{ printf "clamp_%s" .userId | quote }}
                    headers:
                      - name: authorization
                        string_match:
                          prefix: {{ printf "Basic %s" (b64enc .userId) | quote }}
            - actions:
                - header_value_match:
                    descriptor_key: tenant
                    descriptor_value: {{ printf "clamp_%s" .userId | quote }}
                    headers:
                      - name: authorization
                        string_match:
                          prefix: {{ printf "Bearer %s" .userId | quote }}
            {{- end }}
{{- end }}
