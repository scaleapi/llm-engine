{{- if empty .Values.azure }}
# Scoped to the pods the attributegen WasmPlugin below runs on, the only ones with a
# request_operation value. Istio applies only the oldest selector-less Telemetry in
# istio-system, so a mesh-wide one here can silently override the mesh owner's.
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: {{ include "modelEngine.fullname" . }}-custom-tags
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "modelEngine.selectorLabels.gateway" . | nindent 6 }}
  metrics:
  - overrides:
    - match:
        metric: REQUEST_COUNT
        mode: CLIENT_AND_SERVER
      tagOverrides:
        request_operation:
          # Istio >= 1.24 needs the fully qualified form: filter_state['wasm.istio_requestOperation'].
          value: {{ .Values.istioAttributegen.tagExpression | quote }}
    providers:
    - name: prometheus
---
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: {{ include "modelEngine.fullname" . }}-attributegen
  namespace: istio-system
spec:
  {{- with .Values.istioAttributegen.failStrategy }}
  failStrategy: {{ . }}
  {{- end }}
  imagePullPolicy: IfNotPresent
  phase: AUTHN
  pluginConfig:
    attributes:
    - match:
      {{- include "modelEngine.istioAttributeMatchConditions" . | nindent 6 }}
      output_attribute: istio_requestOperation
  selector:
    matchLabels: 
      {{- include "modelEngine.selectorLabels.gateway" . | nindent 6 }}
  url: {{ .Values.istioAttributegen.url | quote }}
  {{- with .Values.istioAttributegen.sha256 }}
  sha256: {{ . | quote }}
  {{- end }}
{{- end }}
