{{- if .Values.virtualservice.enabled -}}
{{- $fullName := include "modelEngine.fullname" . -}}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "modelEngine.labels" . | nindent 4 }}
  {{- with .Values.virtualservice.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hosts:
  {{- range .Values.virtualservice.hostDomains }}
    - "{{ $fullName }}.{{ . }}"
  {{- end }}
  gateways:
  {{- range .Values.virtualservice.gateways }}
    - {{ . | quote }}
  {{- end }}
  http:
    - route:
        - destination:
            host: "{{ $fullName }}.{{ .Release.Namespace }}.svc.cluster.local"
            port:
              number: 80
      retries:
        attempts: {{ ((.Values.virtualservice).retries).attempts | default 3 }}
        {{- /* 503 is deliberately not retried: it is the overload signal, and retrying
             it multiplies offered load exactly when the fleet is saturated. Numeric
             codes in retryOn map to Envoy retriable-status-codes. */}}
        retryOn: {{ ((.Values.virtualservice).retries).retryOn | default "connect-failure,unavailable,502,504" | quote }}
        {{- with ((.Values.virtualservice).retries).perTryTimeout }}
        perTryTimeout: {{ . }}
        {{- end }}
{{- end }}
