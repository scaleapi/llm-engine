{{- $shutdown := .Values.gateway.shutdown }}
{{- /* Gunicorn's --graceful-timeout (start_fastapi_server.py) */}}
{{- $gunicornGracefulTimeoutSeconds := 60 }}
{{- if lt (int $shutdown.terminationGracePeriodSeconds) (add (int $shutdown.preStopSleepSeconds) $gunicornGracefulTimeoutSeconds | int) }}
{{- fail (printf "gateway.shutdown.terminationGracePeriodSeconds must be at least preStopSleepSeconds + %d (Gunicorn's graceful timeout), or in-flight requests are killed" $gunicornGracefulTimeoutSeconds) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modelEngine.fullname" . }}
  labels:
    {{- include "modelEngine.selectorLabels.gateway" . | nindent 4 }}
    {{- include "modelEngine.labels" . | nindent 4 }}
    tags.datadoghq.com/service: {{ include "modelEngine.fullname" . }}
spec:
  {{- if not .Values.autoscaling.horizontal.enabled }}
  replicas: {{ .Values.replicaCount.gateway }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # Protects against out of resource pod eviction during rolling update
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "modelEngine.selectorLabels.gateway" . | nindent 6 }}
  template:
    metadata:
      annotations:
        ad.datadoghq.com/main.logs: |
          [{
            "service": {{ include "modelEngine.fullname" . | quote }},
            "source": "python"
          }]
        sidecar.istio.io/proxyMemoryLimit: "5Gi"
        sidecar.istio.io/proxyMemory: "1Gi"
        {{- /* Without a CPU request the sidecar is starved on nodes packed to their CPU
             request capacity, its postStart hook hangs, and new gateway pods never
             become Ready. No CPU limit: throttling the proxy adds tail latency. */}}
        sidecar.istio.io/proxyCPU: {{ .Values.gateway.sidecarCPURequest | quote }}
        {{- if .Values.rateLimits.enabled }}
        {{- /* Exposes the local_ratelimit shed counter to Prometheus (Istio prunes
             envoy stats by default); the shed-based HPA metric reads it. */}}
        sidecar.istio.io/statsInclusionPrefixes: "model_engine_ratelimit"
        {{- end }}
        {{- /* The sidecar gets SIGTERM when the pod is deleted, not after the app's
             preStop hold, and by default exits 5s later, while the hold and Gunicorn's
             drain run for longer. EXIT_ON_ZERO_ACTIVE_CONNECTIONS makes it wait
             MINIMUM_DRAIN_DURATION, then exit as soon as no connection is open (the
             app's own outbound connections count), so terminationGracePeriodSeconds
             is its only ceiling; terminationDrainDuration is not read in this mode.
             MINIMUM_DRAIN_DURATION outlasts the hold, so a moment with no open
             connection while callers reconnect cannot end it early. Without Istio
             the annotation is inert. */}}
        proxy.istio.io/config: |
          proxyMetadata:
            EXIT_ON_ZERO_ACTIVE_CONNECTIONS: "true"
            MINIMUM_DRAIN_DURATION: "{{ add (int $shutdown.preStopSleepSeconds) 5 }}s"
      labels:
        {{- include "modelEngine.selectorLabels.gateway" . | nindent 8 }}
        {{- include "modelEngine.labels" . | nindent 8 }}
        tags.datadoghq.com/service: {{ include "modelEngine.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ int $shutdown.terminationGracePeriodSeconds }}
      priorityClassName: model-engine-high-priority
      containers:
        - name: {{ include "modelEngine.fullname" . }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.gatewayRepository }}:{{ .Values.tag}}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            periodSeconds: 2
            timeoutSeconds: {{ .Values.gateway.readinessProbeTimeoutSeconds }}
            failureThreshold: 30
          {{- if gt (int $shutdown.preStopSleepSeconds) 0 }}
          {{- /* Keep serving while the endpoint removal reaches the ingress gateway and
               the callers' sidecars; Gunicorn gets SIGTERM only after the hold. python,
               not sleep or sh: the runtime image is Chainguard python, which has neither,
               and a failing preStop exec only logs FailedPreStopHook before SIGTERM. Not
               the native sleep action, which needs Kubernetes 1.30. */}}
          lifecycle:
            preStop:
              exec:
                command: ["python", "-c", "import time; time.sleep({{ int $shutdown.preStopSleepSeconds }})"]
          {{- end }}
          command:
            - dumb-init
            - --
            {{- if .Values.datadog.enabled }}
            - ddtrace-run
            {{- end }}
          args:
            - python
            - -m
            - model_engine_server.entrypoints.start_fastapi_server
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "modelEngine.gatewayEnv" . | indent 10 }}
          {{- include "modelEngine.volumeMounts" . | indent 10 }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      serviceAccountName: {{ include "modelEngine.fullname" . }}
      {{- include "modelEngine.volumes" . | indent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
