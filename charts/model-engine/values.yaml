dd_trace_enabled: true

# datadog [optional] configures Datadog tagging for model-engine pods.
datadog:
  # env [optional] sets the Datadog `env` tag (DD_ENV + tags.datadoghq.com/env) on both
  # control-plane pods and launched inference endpoints. Falls back to `context` when empty.
  # Set per-cluster (e.g. "sgp-dev") so pods report the cluster's real environment.
  env: ""

spellbook:
  enabled: false

# celery_enable_sha256 [optional] uses SHA256 hashes for federal compliance mode (FIPS, enhanced security)
celery_enable_sha256: null

# debug_mode [optional] enables detailed debug logging for infrastructure components
debug_mode: null

# celery_broker_type_redis [optional] explicitly uses Redis for the Celery broker
celery_broker_type_redis: null

#uncomment below if using a container image that requires nonroot (ex. chainguard)
# podSecurityContext:
#   runAsUser: 65532
#   runAsGroup: 65532
#   runAsNonRoot: true
#   fsGroup: 65532

# containerSecurityContext:
#   allowPrivilegeEscalation: false
#   readOnlyRootFilesystem: false
#   capabilities:
#     drop:
#       - ALL

# gateway [optional] tuning for the gateway deployment.
gateway:
  # readinessProbeTimeoutSeconds sets the /readyz probe timeout. The k8s default of 1s
  # ejects saturated-but-healthy pods and concentrates load on the survivors.
  readinessProbeTimeoutSeconds: 5
  # sidecarCPURequest sets the istio-proxy CPU request (no limit). Without it the
  # sidecar is starved on nodes at full CPU request capacity and pods never go Ready.
  sidecarCPURequest: 250m
  # retries is the Envoy retry policy on the gateway VirtualService. perTryTimeout
  # stays unset by default: the route carries streaming and long-lived requests,
  # which a per-try timeout would abort mid-flight.
  retries:
    attempts: 3
    retryOn: connect-failure,unavailable,502,504
    perTryTimeout: null

# rateLimits [optional] per-pod Envoy local_ratelimit token buckets on the gateway
# sidecars (inbound). Overflow returns 429 at the proxy without reaching a gateway
# worker. Buckets are per pod: the fleet ceiling is limit x Ready pods.
rateLimits:
  enabled: false
  # Route matching is on Envoy :path, which includes the query string, so prefixes
  # (not exact paths) are required. The trailing slash on the poll route keeps
  # POST /v1/async-tasks out of the GET bucket.
  routes:
    # Task-status polls. A runaway-storm ceiling AND the aggregate byte bound: polls
    # return task results inline (up to multi-MB), and the 2026-08 incident's binding
    # resource was node NIC egress (~500MB/s per pod). 50 rps/pod caps worst-case
    # egress at ~265MB/s/pod while still admitting ~15x baseline traffic (1,500 rps
    # at a 30-pod fleet, ~= the incident's peak). Revisit upward once inline results
    # are replaced by presigned URLs (MLI-8311).
    - name: get_async_task
      method: GET
      pathPrefix: /v1/async-tasks/
      requestsPerSecondPerPod: 50
      burst: 100
    # Task submissions. Proportionally tighter: producing above endpoint drain is pure
    # harm, and each submit costs a Postgres reader lookup + SQS send.
    - name: post_async_tasks
      method: POST
      pathPrefix: /v1/async-tasks
      requestsPerSecondPerPod: 20
      burst: 40
redis:
  auth:
  authSecretName: ""
  authSecretKey: ""
  enableTLS: false
  enableAuth: false
  kedaSecretName: ""
  unsafeSsl: false
db:
  runDbInitScript: false
  runDbMigrationScript: true
balloonConfig:
  reserveHighPriority: true
balloonNodeSelector:
  node-lifecycle: normal
nodeSelector:
  node-lifecycle: normal
keda:
  cooldownPeriod: 300

# Configurable inference framework image tags
inferenceFramework:
  vllm: "latest"
  deepspeed: "latest"
  text_generation_inference: "latest"
  lightllm: "latest"
  tensorrt_llm: "latest"
  vllm_batch: "0.17.1-batch"
  vllm_batch_v2: "0.17.1-batch"

# Extensibility hooks for wrapper charts (e.g. airgapped/on-prem deployments)
extraEnvVars: []              # Extra env vars for all main containers (gateway, builder, cacher)
extraVolumes: []              # Extra volumes for all deployments
extraVolumeMounts: []         # Extra volume mounts for main containers
extraPodEnvFrom: []           # Extra envFrom for inference pods (e.g., MinIO credentials)
# Extra volumes for every workload the service template renders that reads object
# storage: the endpoint Deployment, both halves of a LeaderWorkerSet, the batch jobs and
# the input-downloader initContainer. Distinct from extraVolumes above, which only
# reaches the control-plane deployments. These pod specs have a fixed volume list, so a
# site that has to hand them a file (a private CA for an S3 endpoint, say) has no other
# way in: extraPodEnvFrom carries env only, and both existing mounts use subPath/items
# and project a single named key.
extraPodVolumes: []
extraPodVolumeMounts: []

# PVC-backed model cache for endpoint pods. When enabled, model downloads are cached on
# one endpoint-scoped PVC instead of the pod's ephemeral storage. The default access
# mode is ReadWriteMany so replicas and multinode endpoints can share the cache, but
# storageClassName must point to an RWX-capable storage class unless the cluster default
# already supports RWX. Cold multinode starts are serialized through one shared download;
# later restarts reuse the cache.
modelCache:
  enabled: false
  storage: 100Gi
  storageClassName: null
  accessMode: ReadWriteMany
  mountPath: /mnt/model-cache
  # Seconds before a model-cache download lock is considered abandoned after its
  # heartbeat stops updating.
  lockStaleSeconds: 600

# Service account token control
automountServiceAccountToken: true

# Configurable utility images (for airgapped environments)
utilityImages:
  busybox:
    repository: "public.ecr.aws/docker/library/busybox"
    tag: "latest"
  curl:
    repository: "curlimages/curl"
    tag: "7.72.0"
  ubuntu:
    repository: "public.ecr.aws/ubuntu/ubuntu"
    tag: "latest"

# Additional GPU tolerations for endpoint pods
gpuTolerations: []

# GCP configuration for GCP-based deployments
gcp:
  project_id: ""
  pubsub_topic_prefix: "launch-endpoint-id-"
  pubsub_subscription_prefix: "launch-endpoint-id-"
